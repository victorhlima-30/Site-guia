<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="card">
        <h2> Criar Conta </h2>

        <div class="form-group">
            <label for="nome"> Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="nascimento"> Data de nascimento</label>
            <input type="date" id="nascimeto" placeholder=" digite sua data"> </div>

         <div class="form-group">
            <label for="Telefone"> telefone</label>
            <input type="tel" id="telefone" placeholder="(00)0000-0000">
         </div>

         <div class="form-group">
            <label for="email"> E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
         </div>
            
         <button type="button" class="btn-principal" id="btnSalvar">Cadastrar</button>
         <a href="index2.html" class="btn-Segundario">voltar para o login</a>

         <div class="menssagem" id="mensagemCadastro"></div>

         <script src="casdastro.js"></script>
    
</body>
</html>
